services:
  api:
    build: .
    ports: ["127.0.0.1:8000:8000"]
    environment:
      CENSUS_ADMIN_TOKEN: ${CENSUS_ADMIN_TOKEN:?Run scripts/init_env.py first}
      CENSUS_READER_TOKEN: ${CENSUS_READER_TOKEN:-}
      CENSUS_INGEST_TOKEN: ${CENSUS_INGEST_TOKEN:-}
      CENSUS_DATABASE_URL: sqlite:////app/data/census.db
      CENSUS_ALLOWED_ORIGINS: ${CENSUS_ALLOWED_ORIGINS:-}
      CENSUS_ALLOW_PRIVATE: ${CENSUS_ALLOW_PRIVATE:-false}
      CENSUS_ALLOW_HTTP: ${CENSUS_ALLOW_HTTP:-false}
      CENSUS_MONITOR_INTERVAL_SECONDS: "30"
    volumes: ["census-data:/app/data"]
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
  postgres:
    image: postgres:16-alpine
    profiles: [postgres]
    environment:
      POSTGRES_DB: census
      POSTGRES_USER: census
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/init_env.py first}
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U census"]
      interval: 5s
      timeout: 5s
      retries: 10
  api-postgres:
    extends: api
    profiles: [postgres]
    ports: !override ["127.0.0.1:8001:8000"]
    environment:
      CENSUS_DATABASE_URL: postgresql+psycopg://census:${POSTGRES_PASSWORD}@postgres:5432/census
    depends_on:
      postgres: {condition: service_healthy}
volumes:
  census-data:
  postgres-data:
