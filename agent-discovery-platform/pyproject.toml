[build-system]
requires = ["setuptools==82.0.1", "wheel==0.46.3"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-discovery-platform"
version = "0.1.0"
description = "Evidence-based agent census, identity resolution and shadow-agent research prototype"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "fastapi==0.135.1", "pydantic==2.12.5", "SQLAlchemy==2.0.48",
  "httpx==0.28.1", "uvicorn==0.41.0",
  "starlette==0.52.1", "anyio==4.12.1",
  "opentelemetry-api==1.40.0", "opentelemetry-sdk==1.40.0",
]

[project.optional-dependencies]
dev = ["pytest==9.0.2", "pytest-cov==7.0.0", "ruff==0.15.5", "mypy==1.19.1", "build==1.4.0"]
postgres = ["psycopg[binary]==3.3.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_census = ["dashboard.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["third_party"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
files = ["src/agent_census"]
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true

[tool.coverage.run]
source = ["agent_census"]
